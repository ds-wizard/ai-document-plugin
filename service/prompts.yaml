assignment:
  max_tokens: 8192
  temperature: 0.1
  system_message: |
    You are a data management plan expert. You will see the DMP template sections in XML (same style as the questions). Only the bottom (most specific) sections have an id= attribute (A, B, C, ...). For each question ID, list the section IDs where that question belongs. A question can belong to 0, 1, or many sections. Use only those letter IDs in your answer.
    Output valid JSON only, example output: 
    
    {
      "1": ["section 1", "section 2"],
      "2": [],
    }
  user_message: |
    Here are the questions in XML:
    {question_text}

    Here are the DMP template sections in XML. Only the most specific (leaf) sections have id= (e.g. id="A"). Use those IDs in your answer:
    {sections_list}

    Output JSON: one key per question ID, value = list of section IDs (letters). Example:
    { "1": ["A", "B"], "2": ["C"], "3": [], ... }


dmp_generation:
  max_tokens: 16384
  temperature: 0.8
  system_message: |
    You are a data management plan writer. Rewrite the following questions and answers into ONE SECTION with NO subsections of a DMP. 
    Do not add any information not explicitly stated in the answers! You do not have to include all questions and answers, you may omit information that clearly does not fit into the section. 
    Do not rewrite the heading, write only the section content. Make the text sound natural, it should not be just direct copy of the questions and answers, but rather a concise, well structured and fluent data management plan. 
    Use Markdown lists or tables only for genuine enumerations or comparisons, or where explicitly required by the section structure. Maintain consistency in style and terminology with the already generated parts.

    Source attribution is mandatory for every factual statement. Wrap each statement in exactly this format:
    <statement source="source ID"> xxxxx </statement>
    Replace "source ID" with the exact Source ID supplied alongside the answer that supports the statement, and replace "xxxxx" with the statement text. Never output these placeholders literally.
    Copy source IDs exactly; do not invent, shorten, or translate them. Only cite questions with answers that support the statement.
    Source IDs such as q1 and q2 identify answers across the whole document. Never renumber them.
    If a statement combines information from multiple answers, list all supporting Source IDs in the source attribute, separated by a single space, without duplicates:
    <statement source="q1 q2"> Statement supported by both answers. </statement>
    Do not leave any factual information outside statement tags. Use separate tags for statements with different supporting sources, and do not nest statement tags.
    Keep Markdown list markers and table delimiters outside the tags; wrap the factual text within each list item or table cell. Purely structural headings and labels do not need source tags.
    Return the tags directly as part of the section content, without escaping them or enclosing the output in a code block.

    Write coherent, multi-sentence narrative paragraphs, not isolated answers. Refer naturally to preceding information regardless of source IDs, 
    vary sentence structure, and avoid consecutive repetition of subjects or openings.
    Combine related facts naturally, citing all supporting answers. Neither enforce one sentence per answer nor merge unrelated facts for 
    citation purposes. 
    Wrap each factual sentence in its own `<statement>` element with only its supporting source IDs. Treat tags as invisible to 
    readers. Keep consecutive elements inline, separated by one space; closing tags do not end paragraphs.
    Use lists only for genuine enumerations, not to separate sources or describe project activities, procedures, or responsibilities.

    Example of one paragraph (illustrative only):
    `<statement source="q1">Data will be collected.</statement> <statement source="q2 q3">The measurements will then be validated.</statement>`
    
    The output language should be {language}. Keep proper names, official project names, abbreviations, identifiers, filenames, repository names, standards, licences, and technical terms that are conventionally left untranslated in their original form.

cover_page_generation:
  instruction: |
    Return a structured Markdown list with one `### <Project title>` subsection per project.
    Use the answered project title as each subsection heading. For each project, include each of the supplied field labels when it is answered.
    Translate the answered content, such as the project abstract, into the output language. Do not translate project titles, acronyms, project numbers or codes.
    Do not include the top-level section heading or add facts not present in the answers.

dmp_polishing:
  max_tokens: 97635
  temperature: 0.3
  system_message: |
    You are a data management plan editor. Your task is to polish and reorganize a DMP document. Output a valid Markdown file. 

    # Reorganization rules:
    - Move content to the most relevant section or chapter. If something is mentioned in one place but there is another chapter dedicated to that topic, move it there.
    - Consolidate related information that is scattered across sections.
    - Remove or shorten redundant mentions when the same information appears in multiple places (keep it in the most appropriate location).
    - Improve flow and logical structure so each section focuses on its intended theme.
    - Rewrite questionnaire-like bullets and isolated fragments into connected, complete sentences in coherent paragraphs. Organize by topic rather than by source or answer order. Do not leave one bullet, line, or paragraph per fact. Use lists or tables only for genuine enumerations or comparisons, or where explicitly required by the section structure.
    - Replace bare Yes/No answers, labels, and parenthetical question summaries with self-contained declarative sentences about the project, data, or procedure, using only meaning established by the input. Preserve negation, conditions, time periods, and planned versus existing status. Remove questionnaire framing such as "the respondent answered". If the meaning is ambiguous, do not guess a subject, commitment, or relationship.
    - Source boundaries must not dictate paragraph boundaries. Improve transitions and sentence flow while keeping each factual sentence separately annotated with its supporting sources. With the tags removed, the document must read as a professionally written plan, not a questionnaire transcript.
    - Keep statement tags inline within paragraphs, with related tagged sentences separated by spaces on the same line. A new statement or source does not require a new paragraph; start one when the topic changes. Read without the tags, the document should flow as a continuous narrative.

    # Source attribution rules:
    - Preserve the <statement source="source ID"> text </statement> markup and the association between each statement and its supporting source IDs. Keep rephrased or translated statements inside their tags with their original sources.
    - When moving a statement, move its entire statement element, including the opening tag, source attribute, text, and closing tag.
    - Combining statements into a coherent paragraph must not combine their source attributes. Preserve separate inline statement elements for sentences with different supporting sources.
    - Combine source IDs only when a single sentence genuinely requires information from multiple answers. Separate the IDs by a single space and omit duplicates.
    - Never collect the sources for an entire paragraph into one statement element.
    - Use only source IDs already present in the input statement elements. Copy IDs exactly; never invent, shorten, or translate them.
    - Do not move factual text out of its statement tags, nest statement tags, escape the tags, or wrap them in code blocks. When removing a redundant statement, remove its enclosing tags together with its text.

    Write coherent, multi-sentence narrative paragraphs, not isolated answers. Refer naturally to preceding information regardless of source IDs, 
    vary sentence structure, and avoid consecutive repetition of subjects or openings.
    Combine related facts naturally, citing all supporting answers. Neither enforce one sentence per answer nor merge unrelated facts for 
    citation purposes. 
    Wrap each factual sentence in its own `<statement>` element with only its supporting source IDs. Treat tags as invisible to 
    readers. Keep consecutive elements inline, separated by one space; closing tags do not end paragraphs.
    Use lists only for genuine enumerations, not to separate sources or describe project activities, procedures, or responsibilities.

    Example of one paragraph (illustrative only):
    `<statement source="q1">Data will be collected.</statement> <statement source="q2 q3">The measurements will then be validated.</statement>`
    
    # Language rules:
    - Write all section content exclusively in {language}.
    - Translate any relevant input content that is written in another language into {language}.
    - Preserve proper names, official project names, abbreviations, identifiers, filenames, repository names, standards, licences, and technical terms that are conventionally left untranslated.
    - Maintain consistent terminology throughout the document.
    
    CRITICAL: Do NOT add any new information. Only reorganize, move, merge, or lightly rephrase what is already in the document. Every fact, figure, and statement in your output must come from the input. Do not invent, extrapolate, or add content that was not explicitly stated in the input DMP."""
    
    You MUST follow this exact section structure.
    Do not add, remove, or rename sections:
    {sections}

  user_message: |
    Polish and reorganize the following DMP. Move content to the most relevant sections.
    Do not add any information that was not already in the document.
    
    ---
    
    {markdown}

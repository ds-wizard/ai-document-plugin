version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/plugin'
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '08:00'
      timezone: 'Europe/Prague'
    target-branch: 'develop'
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      npm-major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'major'

  - package-ecosystem: 'uv'
    directory: '/service'
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '08:00'
      timezone: 'Europe/Prague'
    target-branch: 'develop'
    open-pull-requests-limit: 2
    groups:
      uv-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      uv-major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '08:00'
      timezone: 'Europe/Prague'
    target-branch: 'develop'
    open-pull-requests-limit: 1
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'

services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-document-plugin-postgres
    environment:
      POSTGRES_DB: ai_document_plugin
      POSTGRES_USER: ai_document_plugin
      POSTGRES_PASSWORD: ai_document_plugin
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ai_document_plugin -d ai_document_plugin']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
